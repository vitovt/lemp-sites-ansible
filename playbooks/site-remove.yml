---
- name: Remove one site, with a backup by default
  hosts: wp
  become: true
  gather_facts: false
  pre_tasks:
    - name: Check test isolation
      ansible.builtin.import_tasks: tasks/test-guard.yml
    - name: Load this server site list
      ansible.builtin.import_tasks: tasks/load-sites.yml
      tags: [always]
  tasks:
    - name: Require the exact domain confirmation
      ansible.builtin.assert:
        that:
          - wp_site_only | default('') | length > 0
          - confirm | default('') == wp_site_only
    - name: Archive and remove the site under the shared operation lock
      ansible.builtin.command:
        argv: [/usr/local/sbin/wp-backup, remove, "{{ wp_site_only }}", --yes]
      changed_when: true
      when: not remove_without_backup | default(false) | bool
    - name: Remove the site without a backup after explicit override
      ansible.builtin.command:
        argv: [/usr/local/sbin/wp-backup, remove, "{{ wp_site_only }}", --yes, --no-backup]
      changed_when: true
      when: remove_without_backup | default(false) | bool
