---
- name: WordPress hosting v2
  hosts: wp
  become: true
  pre_tasks:
    - name: Check test isolation
      ansible.builtin.import_tasks: tasks/test-guard.yml
    - name: Load this server site list
      ansible.builtin.import_tasks: tasks/load-sites.yml
      tags: [always]

  roles:
    - { role: preflight, tags: [preflight, always] }
    - { role: common, tags: [common] }
    - { role: telegram_alert, tags: [telegram_alert] }
    - { role: nginx, tags: [nginx] }
    - { role: firewall, tags: [firewall] }
    - { role: php, tags: [php] }
    - { role: mariadb, tags: [mariadb] }
    - { role: valkey, tags: [valkey] }
    - { role: certbot_cloudflare, tags: [certbot_cloudflare] }
    - { role: site, tags: [site] }
    - { role: backup_restic, tags: [backup_restic] }
    - { role: wp_monitor, tags: [wp_monitor] }
    - { role: maintenance, tags: [maintenance] }
