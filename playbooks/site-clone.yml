---
- name: Clone one WordPress site
  hosts: wp
  become: true
  gather_facts: false
  pre_tasks:
    - name: Check test isolation
      ansible.builtin.import_tasks: tasks/test-guard.yml
  tasks:
    - name: Validate clone arguments
      ansible.builtin.assert:
        that:
          - clone_from | default('') | length > 0
          - clone_to | default('') | length > 0
          - clone_from != clone_to
    - name: Clone with a rollback copy
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/local/sbin/wp-backup', 'clone', clone_from, clone_to]
             + (['--yes'] if confirm | default('') == clone_to else [])
             + (['--activate'] if clone_activate | default(false) | bool else []) }}
      changed_when: true
