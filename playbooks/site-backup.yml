---
# Back up now (same script as the nightly timer: wp-backup).
#   one site: ansible-playbook playbooks/site-backup.yml --limit wp01 -e wp_site_only=<domain>
#   full run: ansible-playbook playbooks/site-backup.yml --limit wp01
# One site = DB dump + restic snapshot of /srv/sites/<domain> (tag site:<domain>).
# Full run = all dumps, snapshot of all paths, forget/prune, check.
- name: Back up now
  hosts: wp
  become: true
  gather_facts: false
  vars:
    site_backup_domain: "{{ wp_site_only | default('') }}"
  pre_tasks:
    - name: Check test isolation
      ansible.builtin.import_tasks: tasks/test-guard.yml
    - name: Load this server site list
      ansible.builtin.import_tasks: tasks/load-sites.yml
      tags: [always]

  tasks:
    - name: Run wp-backup
      ansible.builtin.command:
        argv: "{{ ['/usr/local/sbin/wp-backup'] + ([site_backup_domain] if site_backup_domain else []) }}"
      register: site_backup_out
      changed_when: true

    - name: Show result
      ansible.builtin.debug:
        var: site_backup_out.stdout_lines
