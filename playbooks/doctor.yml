---
# Read-only health check before changes (same checks as the first step of site.yml):
#   ansible-playbook playbooks/doctor.yml --limit wp01
- name: Doctor (preflight only, no changes)
  hosts: wp
  become: true
  pre_tasks:
    - name: Check test isolation
      ansible.builtin.import_tasks: tasks/test-guard.yml

  roles:
    - { role: preflight, tags: [preflight] }
