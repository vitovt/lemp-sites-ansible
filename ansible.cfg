# Ansible configuration for the WP hosting repo.
# Run every command from the repository root so these relative paths resolve.
[defaults]
library = ./library
inventory = inventories/prod/hosts.yml
# Own roles live in roles/, Galaxy roles are installed into galaxy_roles/ (gitignored).
roles_path = roles:galaxy_roles
# Collections from requirements.yml are installed into ./collections (gitignored).
collections_path = collections:~/.ansible/collections:/usr/share/ansible/collections
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
forks = 10
# A failed task must not drop pending reloads (nginx, php-fpm) of already changed files.
force_handlers = True
# Readable output.
callback_result_format = yaml

[ssh_connection]
# Pipelining speeds up runs and avoids temp-file permission issues with become_user.
pipelining = True
