name: Controller tests
"on": [push, pull_request]
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ansible-galaxy collection install -r requirements.yml -p collections
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: tests/check.sh
      - run: ansible-lint --offline
      - run: python3 tests/probes/cache.py
      - run: python3 tests/probes/real-ip.py

  backup-manager:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test backup management in a disposable container
        run: tests/run-backup-manager-integration.sh

  site-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test local site sessions in a disposable container
        run: tests/run-site-shell-integration.sh
