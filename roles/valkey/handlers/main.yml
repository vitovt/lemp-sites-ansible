---
# Restart (not reload): config and aclfile are read at start. Cache is lost, by design.
- name: Restart valkey
  ansible.builtin.systemd_service:
    name: "{{ valkey_service }}"
    state: restarted

- name: Load Valkey ACL
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      REDISCLI_AUTH="$(cat {{ valkey_admin_pass_file | quote }})"
      valkey-cli --no-auth-warning -s {{ valkey_socket | quote }} --user admin ACL LOAD
      | grep -qx OK
    executable: /bin/bash
  changed_when: true
  no_log: true
