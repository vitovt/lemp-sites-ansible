---
- name: Install Valkey
  ansible.builtin.apt:
    name: "{{ valkey_package }}"
    state: present
    cache_valid_time: 3600

# Same default as the site role: user = domain with "." and "-" as "_".
- name: List sites with object cache
  ansible.builtin.set_fact:
    valkey_sites: >-
      {%- set out = [] -%}
      {%- for domain, cfg in (wp_sites | default({})).items() -%}
      {%- set cfg = cfg | default({}, true) -%}
      {%- if cfg.redis | default(true) | bool -%}
      {%- set _ = out.append({'domain': domain, 'user': cfg.user | default(domain | regex_replace('[.-]', '_'))}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Read or create admin password
  ansible.builtin.set_fact:
    valkey_admin_pass: >-
      {{ lookup('ansible.builtin.password', valkey_secrets_dir ~ '/admin.pass',
         chars=['ascii_letters', 'digits'], length=32) }}
  no_log: true

- name: Check the installed admin password file
  ansible.builtin.stat:
    path: "{{ valkey_admin_pass_file }}"
  register: valkey_admin_file_state

- name: Read the installed admin password
  ansible.builtin.slurp:
    src: "{{ valkey_admin_pass_file }}"
  register: valkey_admin_existing
  when: valkey_admin_file_state.stat.isreg | default(false)
  no_log: true

- name: Check whether the admin password stayed the same
  ansible.builtin.set_fact:
    valkey_acl_reload_safe: >-
      {{ (valkey_admin_existing.content | default('') | b64decode | trim) == valkey_admin_pass
         and valkey_admin_file_state.stat.isreg | default(false) }}
  no_log: true

- name: Install Valkey config
  ansible.builtin.template:
    src: valkey.conf.j2
    dest: "{{ valkey_conf }}"
    owner: valkey
    group: valkey
    mode: "0640"
  notify: Restart valkey

- name: Install Valkey ACL users
  ansible.builtin.template:
    src: users.acl.j2
    dest: "{{ valkey_aclfile }}"
    owner: valkey
    group: valkey
    mode: "0640"
  diff: false
  notify: Apply valkey ACL

- name: Store admin password for root
  ansible.builtin.copy:
    content: "{{ valkey_admin_pass }}\n"
    dest: "{{ valkey_admin_pass_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Enable and start Valkey
  ansible.builtin.systemd_service:
    name: "{{ valkey_service }}"
    enabled: true
    state: started
