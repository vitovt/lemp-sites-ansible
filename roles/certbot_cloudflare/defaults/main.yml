---
# Let's Encrypt via DNS-01 (Cloudflare API), one certificate per site:
# cert name = domain, names = domain + aliases. Runs before the site role;
# the vhost uses /etc/letsencrypt/live/<domain>/ when it exists, else snakeoil.
# false = skip the whole role (local tests, hosts without Cloudflare).
certbot_cloudflare_enabled: true
certbot_cloudflare_packages:
  - certbot
  - python3-certbot-dns-cloudflare
  - bind9-dnsutils   # dig, for the DNS check after a failed request
# Scoped API token (Zone:DNS:Edit). Missing file = role skips with a warning.
certbot_cloudflare_credentials_src: "{{ secrets_dir }}/cloudflare.ini"
certbot_cloudflare_credentials: /etc/letsencrypt/cloudflare.ini
certbot_cloudflare_propagation_seconds: 30
# Empty = register without email (no expiry mails from Let's Encrypt).
certbot_cloudflare_email: ""
# Renewal deploy hook (certbot.timer from the Debian package renews).
certbot_cloudflare_deploy_hook: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
# Extra certbot flags, e.g. ["--test-cert"] for the staging CA.
certbot_cloudflare_extra_args: []
# A failed request does not stop the play: warning + DNS check + tg-alert,
# the site keeps its current certificate (snakeoil for a new site).
# Public resolver for the DNS check.
certbot_cloudflare_dns_resolver: 1.1.1.1
