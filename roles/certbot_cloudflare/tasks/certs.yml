---
- name: Install ACME packages
  ansible.builtin.apt:
    name: "{{ certbot_cloudflare_packages }}"
    state: present

- name: Install DNS credentials
  ansible.builtin.copy:
    src: "{{ certbot_cloudflare_credentials_src }}"
    dest: "{{ certbot_cloudflare_credentials }}"
    owner: root
    group: root
    mode: "0600"
  when: certbot_cloudflare_method == 'dns-cloudflare'
  no_log: true

- name: Create ACME directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ certbot_cloudflare_deploy_hook | dirname }}"
    - "{{ certbot_cloudflare_webroot }}/.well-known/acme-challenge"

- name: Install the renewal hook
  ansible.builtin.template:
    src: reload-nginx.j2
    dest: "{{ certbot_cloudflare_deploy_hook }}"
    owner: root
    group: root
    mode: "0755"

- name: Select certificates
  ansible.builtin.set_fact:
    certbot_cloudflare_certs: >-
      {%- set out = [] -%}
      {%- for domain, cfg in (wp_sites | default({})).items() -%}
      {%- if not (wp_site_only | default('')) or wp_site_only == domain -%}
      {%- set _ = out.append({'domain': domain, 'names': [domain] + ((cfg | default({}, true)).aliases | default([]))}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Find existing vhosts
  ansible.builtin.stat:
    path: "/etc/nginx/sites-enabled/{{ item.domain }}.conf"
  loop: "{{ certbot_cloudflare_certs }}"
  register: certbot_cloudflare_vhosts

- name: Install a temporary HTTP challenge server
  ansible.builtin.copy:
    dest: "/etc/nginx/sites-enabled/acme-{{ item.item.domain }}.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      server {
          listen 80;
          listen [::]:80;
          server_name {{ item.item.names | join(' ') }};
          location ^~ /.well-known/acme-challenge/ {
              root {{ certbot_cloudflare_webroot }};
              try_files $uri =404;
          }
          location / { return 404; }
      }
  when: certbot_cloudflare_method == 'webroot' and not item.stat.exists
  loop: "{{ certbot_cloudflare_vhosts.results }}"
  register: certbot_cloudflare_bootstrap

- name: Apply the challenge server
  ansible.builtin.shell:
    cmd: nginx -t -q && systemctl reload nginx
  when: certbot_cloudflare_bootstrap is changed  # noqa: no-handler (challenge must be served before issuance)
  changed_when: true

- name: Read the certificate names
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      openssl x509 -in /etc/letsencrypt/live/{{ item.domain }}/cert.pem -noout -ext subjectAltName
      | grep -o 'DNS:[^,]*' | cut -d: -f2 | sort
    executable: /bin/bash
  loop: "{{ certbot_cloudflare_certs }}"
  register: certbot_cloudflare_existing
  changed_when: false
  failed_when: false

- name: Request the certificate
  ansible.builtin.command:
    argv: >-
      {{ ['certbot', 'certonly', '--non-interactive', '--agree-tos', '--cert-name', item.item.domain]
         + (['--dns-cloudflare', '--dns-cloudflare-credentials', certbot_cloudflare_credentials,
             '--dns-cloudflare-propagation-seconds', certbot_cloudflare_propagation_seconds | string]
            if certbot_cloudflare_method == 'dns-cloudflare' else ['--webroot', '-w', certbot_cloudflare_webroot])
         + (['--email', certbot_cloudflare_email] if certbot_cloudflare_email else ['--register-unsafely-without-email'])
         + certbot_cloudflare_extra_args + ['-d', item.item.names | unique | join(',')] }}
  loop: "{{ certbot_cloudflare_existing.results }}"
  when: item.stdout_lines | default([]) | sort != item.item.names | unique | sort
  changed_when: true

- name: Remove temporary challenge servers
  ansible.builtin.file:
    path: "/etc/nginx/sites-enabled/acme-{{ item.domain }}.conf"
    state: absent
  loop: "{{ certbot_cloudflare_certs }}"
  notify: reload nginx

- name: Check certificate lifetime
  ansible.builtin.command:
    argv: [openssl, x509, -in, "/etc/letsencrypt/live/{{ item.domain }}/fullchain.pem", -noout, -checkend, '1209600']
  loop: "{{ certbot_cloudflare_certs }}"
  changed_when: false
  when: certbot_cloudflare_require_valid | bool

- name: Check all certificate names
  ansible.builtin.command:
    argv: [openssl, x509, -in, "/etc/letsencrypt/live/{{ item.0.domain }}/fullchain.pem", -noout, -checkhost, "{{ item.1 }}"]
  loop: "{{ certbot_cloudflare_certs | subelements('names') }}"
  register: certbot_cloudflare_name_check
  changed_when: false
  failed_when: certbot_cloudflare_name_check.rc != 0 or 'does match certificate' not in certbot_cloudflare_name_check.stdout
  when: certbot_cloudflare_require_valid | bool

- name: Enable certificate renewal
  ansible.builtin.systemd_service:
    name: certbot.timer
    enabled: true
    state: started

- name: Check the public certificate trust chain
  ansible.builtin.command:
    argv:
      - openssl
      - verify
      - -CAfile
      - /etc/ssl/certs/ca-certificates.crt
      - -untrusted
      - "/etc/letsencrypt/live/{{ item.domain }}/chain.pem"
      - "/etc/letsencrypt/live/{{ item.domain }}/cert.pem"
  loop: "{{ certbot_cloudflare_certs }}"
  changed_when: false
  when: certbot_cloudflare_require_valid | bool
