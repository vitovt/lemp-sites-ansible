---
- name: Install certbot with Cloudflare DNS plugin
  ansible.builtin.apt:
    name: "{{ certbot_cloudflare_packages }}"
    state: present
    cache_valid_time: 3600

- name: Install Cloudflare credentials (root only)
  ansible.builtin.copy:
    src: "{{ certbot_cloudflare_credentials_src }}"
    dest: "{{ certbot_cloudflare_credentials }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# Debian's package creates it only on the first certbot run.
- name: Create renewal hook directory
  ansible.builtin.file:
    path: "{{ certbot_cloudflare_deploy_hook | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install renewal deploy hook
  ansible.builtin.template:
    src: reload-nginx.j2
    dest: "{{ certbot_cloudflare_deploy_hook }}"
    owner: root
    group: root
    mode: "0755"

- name: Enable renewal timer
  ansible.builtin.systemd_service:
    name: certbot.timer
    enabled: true
    state: started

# Same selection as the site role (wp_site_only = one site).
- name: List certificates to manage
  ansible.builtin.set_fact:
    certbot_cloudflare_certs: >-
      {%- set out = [] -%}
      {%- for domain, cfg in (wp_sites | default({})).items() -%}
      {%- if not (wp_site_only | default('')) or wp_site_only == domain -%}
      {%- set _ = out.append({'domain': domain, 'names': [domain] + ((cfg | default({}, true)).aliases | default([]))}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Read names in existing certificates
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      openssl x509 -in /etc/letsencrypt/live/{{ item.domain }}/cert.pem -noout -ext subjectAltName
      | grep -o 'DNS:[^,]*' | cut -d: -f2 | sort
    executable: /bin/bash
  loop: "{{ certbot_cloudflare_certs }}"
  loop_control:
    label: "{{ item.domain }}"
  register: certbot_cloudflare_current
  changed_when: false
  failed_when: false

# New cert, or names changed (alias added/removed). Renewal is certbot.timer's job.
- name: Request certificate (DNS-01)
  ansible.builtin.command:
    argv: >-
      {{ ['certbot', 'certonly', '--non-interactive', '--agree-tos',
          '--dns-cloudflare',
          '--dns-cloudflare-credentials', certbot_cloudflare_credentials,
          '--dns-cloudflare-propagation-seconds', certbot_cloudflare_propagation_seconds | string,
          '--cert-name', item.item.domain]
         + (['--email', certbot_cloudflare_email] if certbot_cloudflare_email else ['--register-unsafely-without-email'])
         + certbot_cloudflare_extra_args
         + ['-d', item.item.names | unique | join(',')] }}
  loop: "{{ certbot_cloudflare_current.results }}"
  loop_control:
    label: "{{ item.item.domain }}"
  when: (item.stdout_lines | default([]) | sort) != (item.item.names | unique | sort)
  register: certbot_cloudflare_request
  # Failure = warning below; the vhost stays on its current (snakeoil) certificate.
  failed_when: false
  changed_when: certbot_cloudflare_request.rc | default(1) == 0

- name: List failed certificate requests
  ansible.builtin.set_fact:
    certbot_cloudflare_failed: >-
      {{ certbot_cloudflare_request.results
         | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | list }}

# Read-only: where the names point, which nameservers serve the zone.
- name: Check DNS for failed names
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for n in {{ item.item.item.names | unique | map('quote') | join(' ') }}; do
        z=$n; ns=""
        while [ -n "$z" ] && [ "${z#*.}" != "$z" ]; do
          ns=$(dig +short NS "$z" @{{ certbot_cloudflare_dns_resolver }} | tr '\n' ' ')
          [ -n "$ns" ] && break; z=${z#*.}
        done
        [ -n "$ns" ] || z=
        a=$(dig +short A "$n" @{{ certbot_cloudflare_dns_resolver }} | tr '\n' ' ')
        cf=no; case "$ns" in *.ns.cloudflare.com.*) cf=yes;; esac
        echo "$n: zone=${z:-?} cloudflare_ns=$cf NS=[${ns% }] A=[${a% }]"
      done
    executable: /bin/bash
  loop: "{{ certbot_cloudflare_failed }}"
  loop_control:
    label: "{{ item.item.item.domain }}"
  register: certbot_cloudflare_dns
  changed_when: false

- name: Warn about failed certificates
  ansible.builtin.debug:
    msg: |-
      WARNING: Let's Encrypt failed for {{ item.item.item.item.domain }}; the site stays on its current certificate (snakeoil if new).
      certbot: {{ (item.item.stderr_lines | default([]) | select | list)[-3:] | join(' | ') }}
      DNS: {{ item.stdout_lines | join(' ; ') }}
      Fix DNS/token, then re-run: ansible-playbook playbooks/site.yml -t certbot_cloudflare,site -e wp_site_only={{ item.item.item.item.domain }}
  loop: "{{ certbot_cloudflare_dns.results }}"
  loop_control:
    label: "{{ item.item.item.item.domain }}"

- name: Alert about failed certificates
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/tg-alert
      - "{{ inventory_hostname }}: Let's Encrypt failed for {{ item.item.item.item.domain }} (site stays on snakeoil/old cert). DNS: {{ item.stdout_lines | join(' ; ') }}"
  loop: "{{ certbot_cloudflare_dns.results }}"
  loop_control:
    label: "{{ item.item.item.item.domain }}"
  changed_when: false
  failed_when: false
