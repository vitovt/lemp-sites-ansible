---
- name: Check the certificate policy
  ansible.builtin.assert:
    that:
      - certbot_cloudflare_method in ['dns-cloudflare', 'webroot']
      - certbot_cloudflare_enabled | bool or not certbot_cloudflare_require_valid | bool
    fail_msg: "Production requires certificate management. Disable the requirement only in isolated tests."

- name: Issue and check certificates
  ansible.builtin.include_tasks: certs.yml
  when: certbot_cloudflare_enabled | bool
