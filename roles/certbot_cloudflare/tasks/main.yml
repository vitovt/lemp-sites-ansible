---
- name: Try certificates independently after site bootstrap
  ansible.builtin.include_tasks: attempt.yml
  loop: "{{ wp_sites | default({}) | dict2items }}"
  loop_control:
    loop_var: certificate_site
    label: "{{ certificate_site.key }}"
  when:
    - certbot_cloudflare_enabled | bool
    - not (wp_site_only | default('')) or wp_site_only == certificate_site.key
