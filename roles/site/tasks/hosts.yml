---
# Nginx Helper sends purge requests to https://<domain>/purge/... .
# Point the site names to this host, so purges skip Cloudflare.
# Proxmox only rewrites its own block in /etc/hosts of a CT.
- name: Map site names to localhost
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1\s.*# wp-site {{ site_cfg.domain | regex_escape }}$'
    line: "127.0.0.1 {{ ([site_cfg.domain] + site_cfg.aliases) | join(' ') }}  # wp-site {{ site_cfg.domain }}"
    owner: root
    group: root
    mode: "0644"
  when: site_cfg.cache
