---
- name: Install the site operator tools
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - jump-in
    - wp-site

- name: Install the site operator shell profile
  ansible.builtin.copy:
    src: site-shell.bashrc
    dest: /usr/local/lib/wp-hosting/site-shell.bashrc
    owner: root
    group: root
    mode: "0644"
