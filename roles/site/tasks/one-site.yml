---
- name: Build the site configuration
  ansible.builtin.import_tasks: config.yml

- name: Check site user name ({{ site_cfg.domain }})
  ansible.builtin.assert:
    that:
      - site_cfg.user is match('^[a-z][a-z0-9_]*$')
      - site_cfg.db_name is match('^[a-z][a-z0-9_]*$')
      - site_cfg.user | length <= site_user_max_len
      - site_cfg.db_name | length <= 64
    fail_msg: "Bad user/db name for {{ site_cfg.domain }}: {{ site_cfg.user }} (max {{ site_user_max_len }} chars, [a-z][a-z0-9_]*)"
    quiet: true

- name: Docroot check ({{ site_cfg.domain }})
  ansible.builtin.include_tasks: docroot.yml
- name: Users ({{ site_cfg.domain }})
  ansible.builtin.include_tasks: users.yml
- name: Directories ({{ site_cfg.domain }})
  ansible.builtin.include_tasks: dirs.yml
- name: Allow the site owner to edit only its local code policy
  ansible.builtin.copy:
    content: "{{ site_cfg.user }} ALL=(root) NOPASSWD: /usr/local/sbin/wp-site policy *\n"
    dest: "/etc/sudoers.d/wp-site-{{ site_cfg.user }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
- name: Check for an existing site Git repository
  ansible.builtin.stat:
    path: "{{ site_cfg.path }}/htdocs/.git"
  register: site_git_repository
- name: Check for an existing site Git ignore file
  ansible.builtin.stat:
    path: "{{ site_cfg.path }}/htdocs/.gitignore"
  register: site_gitignore
- name: Add initial site Git ignore rules
  ansible.builtin.copy:
    src: wordpress.gitignore
    dest: "{{ site_cfg.path }}/htdocs/.gitignore"
    owner: "{{ site_cfg.user }}"
    group: "{{ site_cfg.user }}"
    mode: "0640"
    force: false
  when: not site_git_repository.stat.exists and not site_gitignore.stat.exists
- name: Database ({{ site_cfg.domain }})
  ansible.builtin.include_tasks: db.yml
- name: WordPress config ({{ site_cfg.domain }})
  ansible.builtin.include_tasks: wpconfig.yml
- name: PHP and Nginx route ({{ site_cfg.domain }})
  ansible.builtin.include_tasks: switch-php.yml
- name: Local name for cache purge ({{ site_cfg.domain }})
  ansible.builtin.include_tasks: hosts.yml
- name: Cron and logrotate ({{ site_cfg.domain }})
  ansible.builtin.include_tasks: cron.yml
- name: Optional WordPress install ({{ site_cfg.domain }})
  ansible.builtin.include_tasks: install.yml
  when: >-
    (site_cfg.wp_install | bool)
    or ((site_wp_install | default(false) | bool) and (wp_site_only | default('')) == site_cfg.domain)

# On demand only:
#   ansible-playbook playbooks/site.yml -t site,site_fix_perms -e wp_site_only=<domain>
# ("site" runs the includes). The role tag "site" is inherited, so "never"
# alone would not keep plain "-t site" from running it: guard on run tags.
- name: Reset htdocs owner and modes ({{ site_cfg.domain }})
  ansible.builtin.command:
    cmd: "/usr/local/sbin/site-fix-perms {{ site_cfg.domain }}"
  changed_when: true
  when: "'site_fix_perms' in ansible_run_tags"
  tags: [never, site_fix_perms]

- name: Check existing code permissions
  ansible.builtin.command:
    argv: [/usr/local/sbin/site-fix-perms, "{{ site_cfg.domain }}", --check]
  changed_when: false
