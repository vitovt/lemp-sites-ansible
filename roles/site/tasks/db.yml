---
# Password: generated once on the control node, kept in secrets/ (gitignored).
- name: Read or create DB password
  ansible.builtin.set_fact:
    site_db_pass: >-
      {{ lookup('ansible.builtin.password',
         secrets_dir ~ '/db/' ~ site_cfg.domain ~ '.pass',
         chars=['ascii_letters', 'digits'], length=32) }}
  no_log: true

- name: Create site database
  community.mysql.mysql_db:
    name: "{{ site_cfg.db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_unix_socket: "{{ mariadb_socket }}"

# In GRANT ... ON `db`.* the name is a LIKE pattern: "_" matches any char,
# so jenet_info.* would also match jenetXinfo. Escape it.
- name: Create site DB user
  community.mysql.mysql_user:
    name: "{{ site_cfg.db_name }}"
    host: localhost
    password: "{{ site_db_pass }}"
    priv: "`{{ site_cfg.db_name | replace('_', '\\_') }}`.*:ALL"
    login_unix_socket: "{{ mariadb_socket }}"
  no_log: true
