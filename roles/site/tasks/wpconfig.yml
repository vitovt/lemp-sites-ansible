---
# Created once. Later edits by hand (as root, then site_fix_perms).
# Group <user> lets <user>-php read it; www-data can read it too,
# but nginx never serves .php source (wp-rules + fastcgi only).
- name: Create wp-config.php
  ansible.builtin.template:
    src: wp-config.php.j2
    dest: "{{ site_cfg.path }}/htdocs/wp-config.php"
    owner: "{{ site_cfg.user }}"
    group: "{{ site_cfg.user }}"
    mode: "0640"
    force: false
  diff: false
