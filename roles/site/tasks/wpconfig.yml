---
# Created once. Later edits by hand (as root, then site_fix_perms).
# Group <user> lets <user>-php read it; www-data can read it too,
# but nginx never serves .php source (wp-rules + fastcgi only).
- name: Read or create Valkey password
  ansible.builtin.set_fact:
    site_valkey_pass: >-
      {{ lookup('ansible.builtin.password',
         secrets_dir ~ '/' ~ inventory_hostname ~ '/valkey/' ~ site_cfg.domain ~ '.pass',
         chars=['ascii_letters', 'digits'], length=32) }}
  when: site_cfg.redis | bool
  no_log: true

- name: Create wp-config.php
  ansible.builtin.template:
    src: wp-config.php.j2
    dest: "{{ site_cfg.path }}/htdocs/wp-config.php"
    owner: "{{ site_cfg.user }}"
    group: "{{ site_cfg.user }}"
    mode: "0640"
    force: false
  diff: false

# Existing configs: add WP_REDIS_GRACEFUL only if it is missing (a manual
# value, true or false, is kept). Without it the drop-in returns 500 when
# Valkey is down.
- name: Check WP_REDIS_GRACEFUL in wp-config.php
  ansible.builtin.command:
    cmd: grep -q WP_REDIS_GRACEFUL {{ site_cfg.path }}/htdocs/wp-config.php
  register: site_redis_graceful
  changed_when: false
  failed_when: site_redis_graceful.rc > 1
  when: site_cfg.redis | bool

- name: Add WP_REDIS_GRACEFUL to wp-config.php
  ansible.builtin.lineinfile:
    path: "{{ site_cfg.path }}/htdocs/wp-config.php"
    line: "define( 'WP_REDIS_GRACEFUL', true );"
    insertafter: "WP_REDIS_SELECTIVE_FLUSH"
  register: site_redis_graceful_add
  when: site_cfg.redis | bool and site_redis_graceful.rc == 1

- name: Commit wp-config.php change
  ansible.builtin.command:
    argv: [/usr/local/sbin/wp-git-commit, "{{ site_cfg.domain }}", "wp-config: WP_REDIS_GRACEFUL"]
    removes: "{{ site_cfg.path }}/htdocs/.git"
  changed_when: true
  when: site_redis_graceful_add is changed  # noqa: no-handler (per-site loop var)
