---
# Base dir: /srv/sites/<domain>/{htdocs,conf/nginx,logs,tmp,backup}
site_root: /srv/sites

# Defaults merged under every wp_sites entry (wp_sites values win).
site_defaults:
  php_version: "{{ php_default_version }}"
  aliases: []
  staging: false
  smtp: false
  cache: true
  redis: true
  xmlrpc: false
  # Table prefix for a NEW wp-config.php only.
  table_prefix: wp_
  # FPM pool limits (pm = ondemand).
  pm_max_children: 4
  pm_idle_timeout: 30s
  pm_max_requests: 500
  memory_limit: 256M
  upload_max_filesize: 64M
  # wp-monitor content_spike: alert above N new posts (any type) in 24 h; 0 = off.
  monitor_content_max: 10
  # Fresh WordPress when core is missing (tasks/install.yml). Default off:
  # most sites are migrated. Once from the CLI: -e site_wp_install=true.
  wp_install: false
  wp_version: latest
  wp_locale: en_US
  # Not "admin" (first name bots try). Password: secrets/<host>/wp-admin/<domain>.pass
  wp_admin_user: wpadmin
  wp_admin_email: ""   # empty = admin@<domain>
  wp_title: ""         # empty = domain

# Dirs under htdocs/wp-content that the PHP runtime user may write.
site_writable_dirs:
  - wp-content/uploads
  - wp-content/cache
  - wp-content/upgrade

# Functions disabled in every pool.
site_disable_functions: >-
  exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,
  show_source,dl,posix_kill,posix_setuid,posix_setgid

# Max Linux user name length (useradd limit is 32; "-php" is appended).
site_user_max_len: 28

# Real cron: wp cron runs every N minutes (DISABLE_WP_CRON is set).
site_cron_minute: "*/5"

# wp-config.php salts (new file only; random 64 chars each).
site_wp_salt_names: [AUTH_KEY, SECURE_AUTH_KEY, LOGGED_IN_KEY, NONCE_KEY, AUTH_SALT, SECURE_AUTH_SALT, LOGGED_IN_SALT, NONCE_SALT]

# CLI switch for tasks/install.yml (only together with wp_site_only).
site_wp_install: false
