---
# Nightly backup: DB dump per site, then one restic snapshot of the paths below.
# Restic repo on local disk (Hetzner: separate disk / storage mounted on the host).
backup_restic_mount: /mnt/backups
backup_restic_repo: /mnt/backups/restic
# true = stop unless backup_restic_mount is a mountpoint (a repo on the root
# disk is not a backup). Tests set backup_require_mount=false.
backup_restic_require_mount: "{{ backup_require_mount | default(true) }}"
# Repo password: generated on the control node. Without it the repo cannot be read.
backup_restic_password_src: "{{ secrets_dir }}/{{ inventory_hostname }}/restic.pass"
backup_restic_conf_dir: /etc/restic
backup_restic_bin: /usr/local/sbin/wp-backup
# Paths that do not exist are skipped.
backup_restic_paths:
  - /srv/sites
  - /etc/nginx
  - /etc/php
  - /etc/mysql
  - /etc/letsencrypt
backup_restic_excludes:
  - /srv/sites/*/tmp
  - /srv/sites/*/htdocs/wp-content/cache
backup_restic_keep_daily: 7
backup_restic_keep_weekly: 4
backup_restic_keep_monthly: 6
backup_restic_on_calendar: "*-*-* 03:15:00"
# Archives of removed sites (site-remove.yml).
backup_restic_removed_dir: /mnt/backups/removed
