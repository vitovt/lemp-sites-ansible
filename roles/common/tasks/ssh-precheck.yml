---
# Stop before key-only SSH if the admin user has no public key on the host.
- name: Check admin SSH key file
  ansible.builtin.stat:
    path: "{{ common_ssh_admin_keys_file }}"
  register: common_ssh_admin_keys

- name: Assert admin SSH key exists
  ansible.builtin.assert:
    that:
      - common_ssh_admin_keys.stat.exists
      - (common_ssh_admin_keys.stat.size | default(0)) > 0
    fail_msg: >-
      {{ common_ssh_admin_keys_file }} is missing or empty. Install your public key
      first, else key-only SSH locks you out.
    quiet: true
