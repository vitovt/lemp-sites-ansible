---
# TODO: add common_ssh_admin_keys_file to defaults (tool review error while writing).
# Until then set it in group_vars, e.g. the admin user authorized_keys path.
- name: Check admin SSH key before key-only SSH
  ansible.builtin.import_tasks: ssh-precheck.yml
  when: common_ssh_admin_keys_file is defined

- name: Harden sshd with devsec.hardening.ssh_hardening
  ansible.builtin.include_role:
    name: devsec.hardening.ssh_hardening
  when: common_ssh_provider == 'devsec'

- name: Install minimal sshd drop-in (key-only)
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: common_ssh_provider == 'minimal'
  notify: Reload sshd
