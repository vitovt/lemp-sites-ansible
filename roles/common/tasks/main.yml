---
- name: Check platform is Debian 13
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == common_expected_distribution
      - ansible_facts['distribution_major_version'] == common_expected_major_version
    fail_msg: >-
      Expected {{ common_expected_distribution }} {{ common_expected_major_version }},
      found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}.
    quiet: true

# cache_valid_time trusts the stamp file even when the lists are empty
# (minimal images and CT templates often ship without /var/lib/apt/lists).
- name: Check for apt package lists
  ansible.builtin.find:
    paths: /var/lib/apt/lists
    patterns: "*_Packages*"
  register: common_apt_lists

- name: Update apt cache when lists are missing
  ansible.builtin.apt:
    update_cache: true
  when: common_apt_lists.matched == 0

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"
  notify: Restart cron

- name: Configure unattended upgrades
  ansible.builtin.import_tasks: unattended.yml

- name: Disable unwanted local mail services
  ansible.builtin.import_tasks: mail.yml

- name: Configure SSH
  ansible.builtin.import_tasks: ssh.yml
