---
- name: Find managed sites
  ansible.builtin.stat:
    get_checksum: false
    get_mime: false
    path: "/srv/sites/{{ item.key }}/conf/site.env"
  loop: "{{ wp_sites | default({}) | dict2items }}"
  register: preflight_site_state
  loop_control:
    label: "{{ item.key }}"

- name: Check existing site passwords on the controller
  ansible.builtin.stat:
    get_checksum: false
    get_mime: false
    path: "{{ secrets_dir }}/{{ inventory_hostname }}/{{ item.1 }}/{{ item.0.item.key }}.pass"
  loop: "{{ preflight_site_state.results | selectattr('stat.exists') | list | product(['db', 'valkey']) | list }}"
  loop_control:
    label: "{{ item.0.item.key }}/{{ item.1 }}"
  when: item.1 == 'db' or item.0.item.value.redis | default(true) | bool
  delegate_to: localhost
  become: false
  register: preflight_password_files

- name: Refuse to replace lost passwords
  ansible.builtin.assert:
    that: item.stat.exists | default(false)
    fail_msg: "A managed site password is missing. Restore the controller secrets before deployment."
  loop: "{{ preflight_password_files.results | rejectattr('skipped', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.0.item.key }}/{{ item.item.1 }}"

- name: Check service secret state
  ansible.builtin.stat:
    get_checksum: false
    get_mime: false
    path: "{{ item.remote }}"
  loop:
    - {remote: /etc/restic/password, local: restic.pass}
    - {remote: /root/.valkey-admin.pass, local: valkey/admin.pass}
  loop_control:
    label: "{{ item.local }}"
  register: preflight_service_state

- name: Check service secrets on the controller
  ansible.builtin.stat:
    get_checksum: false
    get_mime: false
    path: "{{ secrets_dir }}/{{ inventory_hostname }}/{{ item.item.local }}"
  loop: "{{ preflight_service_state.results }}"
  when: item.stat.exists
  delegate_to: localhost
  become: false
  loop_control:
    label: "{{ item.item.local }}"
  register: preflight_service_secrets

- name: Refuse to replace lost service secrets
  ansible.builtin.assert:
    that: item.stat.exists | default(false)
    fail_msg: "A service secret is missing. Recover the original secret first."
  loop: "{{ preflight_service_secrets.results | rejectattr('skipped', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.item.local }}"

- name: Check existing WordPress database settings before changes
  hosting_config:
    path: "/srv/sites/{{ item.key }}/htdocs/wp-config.php"
    database: "{{ item.value.db_name | default(item.key | regex_replace('[.-]', '_')) }}"
    password: "{{ lookup('ansible.builtin.file', secrets_dir ~ '/' ~ inventory_hostname ~ '/db/' ~ item.key ~ '.pass', errors='ignore') | default('', true) }}"
  loop: "{{ wp_sites | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Read existing service credentials for drift checks
  ansible.builtin.slurp:
    src: "{{ item.item.remote }}"
  loop: "{{ preflight_service_state.results }}"
  when: item.stat.exists
  register: preflight_service_values
  no_log: true

- name: Refuse implicit service credential rotation
  ansible.builtin.assert:
    that: >-
      item.content | b64decode | trim ==
      lookup('ansible.builtin.file', secrets_dir ~ '/' ~ inventory_hostname ~ '/' ~ item.item.item.local) | trim
    fail_msg: "Service credentials differ. Restore the original controller secret or use a reviewed rotation procedure."
  loop: "{{ preflight_service_values.results | rejectattr('skipped', 'defined') | list }}"
  no_log: true
