---
# Read-only checks, first role of site.yml; alone: playbooks/doctor.yml.
# Any error stops the play before a single change.
preflight_debian_major: "13"
# Free space (MiB) per path; a missing path is checked on its nearest parent.
preflight_min_free_mb:
  /: 2048
  /srv/sites: 2048
  /var: 1024
# Below this: warning only.
preflight_min_mem_mb: 1024
# Packages that must not be installed (they fight nginx for 80/443).
preflight_forbidden_packages:
  - apache2
# Keys allowed in a wp_sites entry (typos would be ignored silently otherwise).
preflight_site_keys:
  - user
  - db_name
  - php_version
  - aliases
  - cache
  - redis
  - xmlrpc
  - table_prefix
  - pm_max_children
  - pm_idle_timeout
  - pm_max_requests
  - memory_limit
  - upload_max_filesize
  - wp_install
  - wp_admin_user
  - wp_admin_email
  - wp_title
  - wp_locale
