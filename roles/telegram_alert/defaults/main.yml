---
# STUB. Interface for telegram_alert.
# Installs /usr/local/bin/telegram-alert "<text>" (used by backup_restic,
# wp_monitor, unattended-upgrades hooks) and /etc/telegram-alert.conf (0600).
# Missing secret files = role skips with a warning.
telegram_alert_token_src: "{{ secrets_dir }}/telegram_bot_token"
telegram_alert_chat_id_src: "{{ secrets_dir }}/telegram_chat_id"
telegram_alert_bin: /usr/local/bin/telegram-alert
telegram_alert_conf: /etc/telegram-alert.conf
