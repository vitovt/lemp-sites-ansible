---
nginx_packages:
  - nginx
  - ssl-cert
  # ngx_cache_purge: Nginx Helper purge method "GET /purge/<url>".
  - libnginx-mod-http-cache-purge
nginx_worker_connections: 2048
nginx_client_max_body_size: 64m
nginx_server_tokens: "off"

# Cloudflare edge ranges. Fetched on the controller at run time;
# the static lists are the fallback when the fetch fails (checked 2026-10-28).
nginx_cloudflare_fetch: true
nginx_cloudflare_ipv4_url: https://www.cloudflare.com/ips-v4
nginx_cloudflare_ipv6_url: https://www.cloudflare.com/ips-v6
nginx_cloudflare_ipv4_fallback:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
nginx_cloudflare_ipv6_fallback:
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32
# Extra proxies that may connect and send CF-Connecting-IP
# (e.g. the IPv4 proxy on the Proxmox host). Set in group_vars.
nginx_trusted_proxies: []
# Only Cloudflare (and trusted proxies) may connect. Others get 444.
nginx_access_mode: cloudflare
nginx_cloudflare_only: "{{ nginx_access_mode != 'direct' }}"
nginx_real_ip_header: "{{ 'X-Forwarded-For' if nginx_access_mode == 'proxy' else 'CF-Connecting-IP' }}"

# FastCGI cache (guests only; see snippets/fastcgi-cache-skip).
nginx_fastcgi_cache_path: /var/cache/nginx/fastcgi
nginx_fastcgi_cache_size: 1g
nginx_fastcgi_cache_inactive: 60m
nginx_fastcgi_cache_valid: 30m

# Rate limit for wp-login.php and xmlrpc.php (per client IP).
nginx_login_rate: 6r/m
nginx_login_burst: 5

# Direct mode exposes IPv6. Open public IPv4 only when required.
nginx_public_ipv4: false
