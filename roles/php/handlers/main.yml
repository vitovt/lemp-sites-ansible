---
- name: Validate active PHP-FPM configurations
  ansible.builtin.command:
    argv: ["php-fpm{{ item }}", -t]
  changed_when: false
  loop: "{{ php_versions_active }}"
  listen: Reload php-fpm

# A reload also starts a stopped service. Only versions with pools are touched.
- name: Reload active PHP-FPM services
  ansible.builtin.systemd_service:
    name: "php{{ item }}-fpm"
    state: reloaded
  loop: "{{ php_versions_active }}"
  listen: Reload php-fpm
